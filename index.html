<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- added to a phone's home screen, it opens full screen, as an app does (the style keeps clear of the notch: env(safe-area-inset-*)) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Blueberry" />
    <meta name="theme-color" content="#16171a" />
    <title>Blueberry Playground</title>
    <style>
      /* the loading screen: up while the game downloads and starts (main.ts moves the bar along, then fades it out) */
      html, body { margin: 0; background: #16171a; }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #16171a; color: #7d848c; font: 12px/1.35 'DotGothic16', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; z-index: 100; transition: opacity 0.45s; user-select: none; -webkit-user-select: none; }
      #loading.done { opacity: 0; pointer-events: none; }
      #loading .ld { width: min(260px, calc(100vw - 32px)); text-align: center; }
      #loading .ld-logo { display: block; width: 60px; height: 60px; margin: 0 auto; shape-rendering: crispEdges; }
      #loading .ld-title { margin: 12px 0 16px; color: #e2bd57; font-size: 18px; letter-spacing: 0.02em; }
      #loading .ld-bar { height: 4px; background: #2a2d31; border: 1px solid #34383e; border-radius: 3px; overflow: hidden; }
      #loading .ld-bar i { display: block; width: 6%; height: 100%; background: #e2bd57; transition: width 0.25s; }
      #loading .ld-step { min-height: 16px; margin-top: 9px; }
      #loading.failed .ld-bar i { background: #d0584a; }
      #loading.failed .ld-step { color: #c8ccd1; line-height: 1.6; }
      #loading .ld-noscript { margin-top: 14px; color: #c8ccd1; line-height: 1.6; }
    </style>
    <!-- a viewer that shows the page but runs no scripts (a chat app's or the Files app's preview on a phone): say so, rather than "Loading" for ever -->
    <noscript><style>#loading .ld-bar, #loading .ld-step { display: none; }</style></noscript>
  </head>
  <body>
    <div id="loading">
      <div class="ld">
        <svg class="ld-logo" viewBox="0 0 15 15" aria-hidden="true"><path fill="#1b1f3a" d="M5 0h5v1h-5zM3 1h2v1h-2zM11 1h1v1h-1zM2 2h1v1h-1zM12 2h1v1h-1zM1 3h1v1h-1zM13 3h1v1h-1zM1 4h1v1h-1zM13 4h1v1h-1zM0 5h1v1h-1zM14 5h1v1h-1zM0 6h1v1h-1zM14 6h1v1h-1zM0 7h1v1h-1zM14 7h1v1h-1zM0 8h1v1h-1zM14 8h1v1h-1zM0 9h1v1h-1zM14 9h1v1h-1zM1 10h1v1h-1zM13 10h1v1h-1zM1 11h1v1h-1zM13 11h1v1h-1zM2 12h1v1h-1zM12 12h1v1h-1zM3 13h2v1h-2zM10 13h2v1h-2zM5 14h5v1h-5z"/><path fill="#2f3f88" d="M12 3h1v1h-1zM12 4h1v1h-1zM13 5h1v1h-1zM13 6h1v1h-1zM12 7h2v1h-2zM12 8h2v1h-2zM12 9h2v1h-2zM11 10h2v1h-2zM10 11h3v1h-3zM9 12h3v1h-3zM5 13h5v1h-5z"/><path fill="#4762bb" d="M5 1h6v1h-6zM3 2h2v1h-2zM6 2h1v1h-1zM8 2h1v1h-1zM10 2h2v1h-2zM2 3h1v1h-1zM5 3h1v1h-1zM9 3h3v1h-3zM2 4h1v1h-1zM5 4h1v1h-1zM9 4h3v1h-3zM1 5h1v1h-1zM6 5h1v1h-1zM8 5h5v1h-5zM1 6h1v1h-1zM5 6h8v1h-8zM1 7h1v1h-1zM4 7h8v1h-8zM1 8h1v1h-1zM3 8h9v1h-9zM1 9h11v1h-11zM2 10h9v1h-9zM2 11h8v1h-8zM3 12h6v1h-6z"/><path fill="#6687dc" d="M4 3h1v1h-1zM4 4h1v1h-1zM2 5h4v1h-4zM2 6h3v1h-3zM2 7h2v1h-2zM2 8h1v1h-1z"/><path fill="#c3d2f5" d="M3 3h1v1h-1zM3 4h1v1h-1z"/><path fill="#1f2648" d="M5 2h1v1h-1zM7 2h1v1h-1zM9 2h1v1h-1zM6 3h3v1h-3zM6 4h3v1h-3zM7 5h1v1h-1z"/></svg>
        <div class="ld-title">Blueberry Playground</div>
        <div class="ld-bar"><i></i></div>
        <div class="ld-step">Loading the game…</div>
        <noscript><div class="ld-noscript">This viewer can't run games: it shows pages without running them (as a chat app's or the Files app's preview on a phone does). Open the game in a web browser instead, such as Chrome, Safari, Edge or Firefox.</div></noscript>
      </div>
    </div>
    <div id="app">
      <canvas id="view"></canvas>
      <div id="ui"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
